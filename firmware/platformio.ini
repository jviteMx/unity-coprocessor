[platformio]
default_envs = matrixportal_s3

[env:matrixportal_s3]
platform = espressif32@6.9.0
board = adafruit_matrixportal_esp32s3
framework = arduino
extra_scripts = post:../tools/package_firmware.py
monitor_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O2
